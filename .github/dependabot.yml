# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    ignore:
      # TypeScript 7 is the native (Go) compiler and does not yet ship the full
      # TS JS compiler API. typescript-eslint, vue-tsc, ts-jest and the Angular
      # compiler all still need it. Drop this once they support TS 7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      typescript-eslint:
        patterns:
          - '@typescript-eslint/*'
      mitosis:
        patterns:
          - '@builder.io/mitosis*'
  - package-ecosystem: 'npm'
    directory: '/react'
    schedule:
      interval: 'daily'
  - package-ecosystem: 'npm'
    directory: '/vue'
    ignore:
      # See the note on the root entry above.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    schedule:
      interval: 'daily'
  - package-ecosystem: 'npm'
    directory: '/vue2'
    schedule:
      interval: 'daily'
  - package-ecosystem: 'npm'
    directory: '/vue2/docs' # vue2 docs app
    ignore:
      - dependency-name: 'vue'
        update-types: ['version-update:semver-major']
    schedule:
      interval: 'daily'
  - package-ecosystem: 'npm'
    directory: '/svelte'
    ignore:
      # See the note on the root entry above.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    schedule:
      interval: 'daily'
    groups:
      typescript-eslint:
        patterns:
          - '@typescript-eslint/*'
  - package-ecosystem: 'npm'
    directory: '/angular'
    ignore:
      # See the note on the root entry above.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    schedule:
      interval: 'daily'
    groups:
      angular:
        patterns:
          - '@angular/*'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
